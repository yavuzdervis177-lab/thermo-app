const WTAG=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const curMonth=()=>today().slice(0,7);
const monLabel=m=>{const [y,mo]=(m||curMonth()).split('-');return MONATE[(+mo||1)-1]+' '+y};
const daysIn=m=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const wday=(m,d)=>{const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,d).getDay()};
const hm=t=>{if(!t||!/^\d{1,2}:\d{2}$/.test(t))return null;const [a,b]=t.split(':').map(Number);return a*60+b};
const fh=n=>n?fmt(n,n%1?2:0):'';
/* Speicherung (eigene Sammlung „stunden“) */
const ST={items:lsGet('isopro_stunden',{}),deleted:new Set(lsGet('isopro_del_stunden',[])),pending:new Set(),col:null,t:{},w:{},synced:false};
function stSave(s){s.updated=Date.now();ST.items[s.id]=s;lsSet('isopro_stunden',ST.items);if(!ST.col)return;ST.pending.add(s.id);clearTimeout(ST.t[s.id]);ST.t[s.id]=setTimeout(()=>stFlush(s.id),700)}
async function stFlush(id){if(ST.deleted.has(id)){ST.pending.delete(id);return}if(ST.w[id]){ST.t[id]=setTimeout(()=>stFlush(id),400);return}const s=ST.items[id];if(!s){ST.pending.delete(id);return}
 const sent=s.updated;ST.w[id]=1;const body=JSON.parse(JSON.stringify(s));for(let a=0;a<2;a++){try{await ST.col.doc(id).set(body);setSync('ok');break}catch(e){if(!(e&&e.code==='unavailable')){setSync('err');break}await new Promise(r=>setTimeout(r,900))}}
 ST.w[id]=0;if(ST.items[id]&&ST.items[id].updated===sent)ST.pending.delete(id)}
async function stDelete(id){ST.deleted.add(id);lsSet('isopro_del_stunden',[...ST.deleted]);clearTimeout(ST.t[id]);ST.pending.delete(id);delete ST.items[id];lsSet('isopro_stunden',ST.items);
 if(ST.col){for(let k=0;k<20&&ST.w[id];k++)await new Promise(r=>setTimeout(r,150));try{await ST.col.doc(id).delete()}catch(e){setSync('err')}}}
function stSub(db){ST.col=db.collection('stunden');ST.col.onSnapshot(snap=>{
  if(!ST.synced){if(snap.metadata.fromCache)return;ST.synced=true;snap.docs.forEach(d=>{if(ST.deleted.has(d.id))ST.col.doc(d.id).delete().catch(()=>{})});
   if(snap.empty&&Object.keys(ST.items).length)Object.values(ST.items).forEach(s=>{if(!ST.deleted.has(s.id)){ST.pending.add(s.id);stFlush(s.id)}});
   else{const n={};snap.docs.forEach(d=>{if(!ST.deleted.has(d.id))n[d.id]=JSON.parse(JSON.stringify(d.data()))});ST.pending.forEach(id=>{if(ST.items[id])n[id]=ST.items[id]});ST.items=n}
   lsSet('isopro_stunden',ST.items);softRender();return}
  let ch=false;snap.docChanges().forEach(c=>{const id=c.doc.id;if(ST.deleted.has(id)){if(c.type!=='removed')ST.col.doc(id).delete().catch(()=>{});return}if(ST.pending.has(id))return;if(c.type==='removed')delete ST.items[id];else ST.items[id]=JSON.parse(JSON.stringify(c.doc.data()));ch=true});
  if(ch){lsSet('isopro_stunden',ST.items);softRender()}},()=>{})}

function dayStd(r){if(!r)return 0;const a=hm(r.von),b=hm(r.bis);if(a!==null&&b!==null){let m=b-a;if(m<0)m+=1440;m-=num(r.pause);return Math.max(0,Math.round(m/60*100)/100)}return num(r.std)}
function sumEinzel(s){let t=0;for(let d=1;d<=daysIn(s.monat);d++)t+=dayStd((s.tage||{})[d]);return t}
function sumMa(m,s){let t=0;for(let d=1;d<=daysIn(s.monat);d++)t+=num((m.h||{})[d]);return t}
function sumTeam(s){return (s.ma||[]).reduce((t,m)=>t+sumMa(m,s),0)}
function sheetTotal(s){return s.typ==='team'?sumTeam(s):sumEinzel(s)}
function sheetTitle(s){return s.typ==='team'?(s.titel||'Mehrere Mitarbeiter'):(s.name||'Mitarbeiter')}

async function photoPages(p,fotos,logo){const d=PdfDoc(false);d.logo=logo;d.newPage();const M=d.M,W=d.W;

 const gap=14,cw=(W-2*M-gap)/2,ih=200,ch=ih+34;let col=0,rowY=d.y,missing=0;
 for(const f of fotos){if(col===0){if(rowY+ch>d.H-pdfFootH()-12){d.newPage();rowY=d.M}}

async function isoPageCanvas(p,d,logo){const ex=isoExportSVG(p,d);const land=false;const PW=land?PDFH:PDFW,PH=land?PDFW:PDFH,M=28;

async function svgToCanvas(svg,w,h,sc){const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(url)}}
